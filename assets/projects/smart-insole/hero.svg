<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Smart insole system diagram</title>
  <rect width="1600" height="900" fill="#faf9f6"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#141414"/>
    </marker>
  </defs>

  <!-- Left foot -->
  <g>
    <text x="250" y="150" font-size="34" font-weight="700" fill="#141414" text-anchor="middle">Left foot</text>
    <rect x="90" y="185" width="320" height="110" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text x="250" y="233" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">4 thermistors</text>
    <text x="250" y="270" font-size="24" fill="#5c5a55" text-anchor="middle">analog inputs</text>
    <rect x="90" y="325" width="320" height="110" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text x="250" y="373" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">IMU</text>
    <text x="250" y="410" font-size="24" fill="#5c5a55" text-anchor="middle">over I2C</text>
  </g>

  <!-- Right foot -->
  <g>
    <text x="250" y="520" font-size="34" font-weight="700" fill="#141414" text-anchor="middle">Right foot</text>
    <rect x="90" y="555" width="320" height="110" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text x="250" y="603" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">4 thermistors</text>
    <text x="250" y="640" font-size="24" fill="#5c5a55" text-anchor="middle">analog inputs</text>
    <rect x="90" y="695" width="320" height="110" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
    <text x="250" y="743" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">IMU</text>
    <text x="250" y="780" font-size="24" fill="#5c5a55" text-anchor="middle">over I2C</text>
  </g>

  <!-- Boards -->
  <rect x="540" y="230" width="330" height="160" rx="18" fill="#141414"/>
  <text x="705" y="298" font-size="30" font-weight="700" fill="#faf9f6" text-anchor="middle">Arduino Nano 33 IoT</text>
  <text x="705" y="340" font-size="24" fill="#d9d6cf" text-anchor="middle">C++ firmware</text>

  <rect x="540" y="600" width="330" height="160" rx="18" fill="#141414"/>
  <text x="705" y="668" font-size="30" font-weight="700" fill="#faf9f6" text-anchor="middle">Arduino Nano 33 IoT</text>
  <text x="705" y="710" font-size="24" fill="#d9d6cf" text-anchor="middle">C++ firmware</text>

  <!-- Sensor to board arrows -->
  <g stroke="#141414" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M410 240 H475 V285 H536"/>
    <path d="M410 380 H475 V335 H536"/>
    <path d="M410 610 H475 V655 H536"/>
    <path d="M410 750 H475 V705 H536"/>
  </g>

  <!-- Bluetooth links -->
  <g stroke="#ff5a00" stroke-width="4" fill="none" stroke-dasharray="14 10" marker-end="url(#arrow)">
    <path d="M870 310 H960 V440 H1036"/>
    <path d="M870 680 H960 V550 H1036"/>
  </g>
  <text x="960" y="210" font-size="26" font-weight="600" fill="#c44400" text-anchor="middle">Bluetooth</text>
  <text x="960" y="244" font-size="26" font-weight="600" fill="#c44400" text-anchor="middle">Low Energy</text>

  <!-- Logger -->
  <rect x="1040" y="405" width="250" height="180" rx="18" fill="#ffffff" stroke="#141414" stroke-width="3"/>
  <text x="1165" y="485" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Python logger</text>
  <text x="1165" y="525" font-size="24" fill="#5c5a55" text-anchor="middle">live sensor data</text>

  <!-- Alert -->
  <path d="M1290 495 H1356" stroke="#141414" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1360" y="405" width="190" height="180" rx="18" fill="#ff5a00"/>
  <text x="1455" y="470" font-size="26" font-weight="700" fill="#141414" text-anchor="middle">Flag risk</text>
  <text x="1455" y="512" font-size="24" fill="#141414" text-anchor="middle">left vs right</text>
  <text x="1455" y="548" font-size="26" font-weight="700" fill="#141414" text-anchor="middle">≥ 2.2 °C</text>
</svg>
